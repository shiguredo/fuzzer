# prek の設定ファイル
# https://prek.j178.dev
#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.3.9"

default_stages = ["pre-commit"]

# prek 組み込みフック (オフラインで動作する Rust ネイティブ実装)
[[repos]]
repo = "builtin"
hooks = [
  # 行末の不要な空白を検出する
  { id = "trailing-whitespace" },
  # ファイル末尾の改行をそろえる
  { id = "end-of-file-fixer" },
  # マージコンフリクトマーカーが残ったコミットを防ぐ
  { id = "check-merge-conflict" },
  # TOML の構文を検査する
  { id = "check-toml" },
  # YAML の構文を検査する (.clang-format は複数ドキュメントの YAML なので除外する)
  { id = "check-yaml", exclude = '^\.clang-format$' },
  # JSON の構文を検査する
  { id = "check-json" },
  # 秘密鍵の誤コミットを防ぐ
  { id = "detect-private-key" },
  # 改行コードの混在を防ぐ
  { id = "mixed-line-ending" },
]

# efmt / elint は shiguredo/erlang-pre-commit 経由で実行する
# バイナリはフックが初回実行時に GitHub Releases から取得するため、個別のインストールは不要
# priority が小さいほど先に実行され、同じ priority なら並列実行される
[[repos]]
repo = "https://github.com/shiguredo/erlang-pre-commit"
rev = "2026.4.0"
hooks = [
  # efmt -w: Erlang ソースを整形する (ファイルを書き換える)
  { id = "efmt", args = ["--parallel"], priority = 0 },
  # efmt -c --check-line-length: efmt は行長を整形しないため、整形後に行長だけ検査する
  { id = "efmt-check", args = ["--parallel", "--check-line-length=120"], priority = 10 },
  # elint: Erlang ソースをリントする
  { id = "elint", priority = 20 },
]

# C ソースは clang-format で整形する
# clang-format のバイナリーはフックが Python パッケージとして導入する
[[repos]]
repo = "https://github.com/pre-commit/mirrors-clang-format"
rev = "v23.1.3"
hooks = [
  # clang-format -i: c_src 配下の C ソースを整形する (ファイルを書き換える)
  { id = "clang-format", files = "^c_src/", priority = 30 },
]
